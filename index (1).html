<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Painel Xit - Free Fire Max</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #0d0d0d;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    user-select: none;
    touch-action: pan-x pan-y;
    overflow: hidden;
  }

  #bg-demo {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 30% 40%, #1a0000 0%, #0d0d0d 60%);
    display: flex; align-items: center; justify-content: center;
    color: #333;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #hint {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    color: #660000;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.4s;
  }

  #panel {
    position: fixed;
    top: 80px; left: 20px;
    width: 260px;
    background: #0f0f0f;
    border: 1.5px solid #cc0000;
    border-radius: 10px;
    box-shadow: 0 0 24px rgba(204,0,0,0.35), 0 0 4px rgba(204,0,0,0.15) inset;
    z-index: 9999;
    overflow: hidden;
    transition: opacity 0.25s, transform 0.25s;
  }
